# Nginx config for the SPA frontend, baked into the production image
# (see Dockerfile). Serves the Vite build output and falls back to
# index.html so client-side routing (React Router 7) survives a hard
# refresh.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # File uploads go through the API as
    # multipart; nginx's default 1m body limit would 413 them. The
    # backend still enforces its own multipart limits.
    client_max_body_size 50m;

    # Same-origin /api → the backend service. The SPA is built with
    # VITE_API_BASE_URL=/api/v1, so without this block a self-contained
    # stack (docker compose up, no edge proxy) has no route to the API.
    # Deployments whose host-level nginx routes /api straight to the
    # backend port simply never hit this block.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — any path that doesn't match a real file gets
    # index.html so React Router can take over.
    #
    # index.html MUST revalidate on every load: the hashed JS bundles
    # are immutable, but a heuristically-cached index.html pointing at
    # an old hash keeps serving a stale build after a deploy. `no-cache`
    # (not no-store) still allows a cheap 304 via the etag.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed assets are immutable — cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
